name: Fix PDM download navigation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-download-navigation:
    if: ${{ !contains(github.event.head_commit.message, '[pdm-nav-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch MainActivity robustly
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/shanpalia/pdm/MainActivity.kt')
          text = path.read_text(encoding='utf-8')

          if 'import android.webkit.DownloadListener' not in text:
              text = text.replace(
                  'import android.webkit.WebViewClient',
                  'import android.webkit.WebViewClient\nimport android.webkit.DownloadListener',
                  1
              )

          request_pattern = re.compile(r'    fun requestDownload\(value: String\) \{.*?\n    \}', re.S)
          request_replacement = '''    fun requestDownload(value: String) {
        val clean = value.trim()
        if (clean.isBlank()) return
        saveHistory(clean)
        screen = "Downloads"
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R && !PdmStorage.hasPublicAccess()) {
            storagePrompt = clean
        } else {
            onDownload(clean)
        }
    }'''
          text, count = request_pattern.subn(request_replacement, text, count=1)
          if count != 1:
              raise SystemExit('requestDownload function was not found')

          open_pattern = re.compile(r'    fun openAddress\(value: String\) \{.*?\n    \}', re.S)
          open_replacement = '''    fun openAddress(value: String) {
        val clean = value.trim()
        if (clean.isBlank()) return
        if (clean.startsWith("magnet:", true) ||
            clean.startsWith("http://", true) ||
            clean.startsWith("https://", true)) {
            requestDownload(clean)
        } else {
            saveHistory(clean)
            browserUrl = "https://www.google.com/search?q=${Uri.encode(clean)}"
            screen = "Browser"
        }
    }'''
          text, count = open_pattern.subn(open_replacement, text, count=1)
          if count != 1:
              raise SystemExit('openAddress function was not found')

          if 'setDownloadListener(DownloadListener {' not in text:
              marker = 'settings.javaScriptEnabled = true; settings.domStorageEnabled = true'
              listener = '''settings.javaScriptEnabled = true; settings.domStorageEnabled = true
            setDownloadListener(DownloadListener { downloadUrl, _, _, _, _ ->
                if (!downloadUrl.isNullOrBlank()) onDownload(downloadUrl)
            })'''
              if marker not in text:
                  raise SystemExit('WebView settings marker was not found')
              text = text.replace(marker, listener, 1)

          path.write_text(text, encoding='utf-8')

      - name: Commit patched MainActivity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/shanpalia/pdm/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Fix PDM download page navigation [pdm-nav-fixed]"
          git push
