name: Apply 1DM style PDM flow

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-build:
    if: ${{ !contains(github.event.head_commit.message, '[idm-flow-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch PDM UI and controls
        shell: python
        run: |
          from pathlib import Path
          import re

          main = Path('app/src/main/java/com/shanpalia/pdm/MainActivity.kt')
          text = main.read_text(encoding='utf-8')

          for old, new in [
              ('import kotlinx.coroutines.launch', 'import kotlinx.coroutines.launch\nimport kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.withContext'),
              ('import java.io.File', 'import java.io.File\nimport java.net.HttpURLConnection\nimport java.net.URL'),
          ]:
              if new.split('\\n')[0] not in text:
                  text = text.replace(old, new, 1)

          p = re.compile(r'@Composable\\nprivate fun PdmApp\\(.*?\\n\\}\\n\\n@Composable\\nprivate fun PermissionScreen', re.S)
          replacement = r'''@Composable
private fun PdmApp(activity: ComponentActivity, incomingUrl: String?, onDownload: (String) -> Unit, onPickTorrent: () -> Unit, onStorageSettings: () -> Unit, requestStorage: (String) -> Unit) {
    val context = activity
    val history = remember(context) { HistoryStore(context) }
    var historyItems by remember { mutableStateOf(history.all()) }
    var screen by rememberSaveable { mutableStateOf("Home") }
    var address by rememberSaveable { mutableStateOf(incomingUrl.orEmpty()) }
    var browserUrl by rememberSaveable { mutableStateOf("https://www.google.com") }
    var splash by remember { mutableStateOf(true) }
    var permissionStep by rememberSaveable { mutableIntStateOf(0) }
    var permissionsReady by rememberSaveable { mutableStateOf(false) }
    var exitDialog by remember { mutableStateOf(false) }
    var dialogUrl by remember { mutableStateOf<String?>(null) }
    var dialogName by remember { mutableStateOf("") }
    var dialogSize by remember { mutableStateOf<Long?>(null) }
    val drawerState = rememberDrawerState(DrawerValue.Closed)
    val drawerScope = rememberCoroutineScope()

    fun finishPermissionFlow() { permissionStep = 0; permissionsReady = true }
    val notificationLauncher = rememberLauncherForActivityResult(ActivityResultContracts.RequestPermission()) {
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R && !PdmStorage.hasPublicAccess()) permissionStep = 2 else finishPermissionFlow()
    }
    LaunchedEffect(Unit) {
        delay(900); splash = false
        if (Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(context, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) permissionStep = 1
        else if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R && !PdmStorage.hasPublicAccess()) permissionStep = 2
        else finishPermissionFlow()
    }
    LaunchedEffect(permissionStep) {
        if (permissionStep == 2) while (true) {
            if (Build.VERSION.SDK_INT < Build.VERSION_CODES.R || PdmStorage.hasPublicAccess()) { finishPermissionFlow(); break }
            delay(350)
        }
    }
    LaunchedEffect(permissionsReady, incomingUrl) {
        if (permissionsReady && incomingUrl != null && incomingUrl.isNotBlank()) {
            address = incomingUrl
            browserUrl = incomingUrl
            screen = "Browser"
        }
    }
    BackHandler(enabled = !splash) {
        if (permissionStep != 0) return@BackHandler
        if (dialogUrl != null) { dialogUrl = null; return@BackHandler }
        if (drawerState.isOpen) { drawerScope.launch { drawerState.close() }; return@BackHandler }
        if (screen == "Browser") screen = "Home" else if (screen != "Home") screen = "Home" else exitDialog = true
    }

    fun saveHistory(v: String) { history.add(v); historyItems = history.all() }
    fun showDownloadDialog(v: String) {
        val clean = v.trim(); if (clean.isBlank()) return
        dialogUrl = clean
        dialogName = clean.substringBefore('?').substringBefore('#').substringAfterLast('/').ifBlank { "download.bin" }
        dialogSize = null
        saveHistory(clean)
    }
    fun enqueueDownload(v: String) {
        val clean = v.trim(); if (clean.isBlank()) return
        val name = dialogName.ifBlank { clean.substringBefore('?').substringAfterLast('/').ifBlank { "download.bin" } }
        context.getSharedPreferences("pdm_active", Context.MODE_PRIVATE).edit().putString(name, clean).apply()
        dialogUrl = null
        screen = "Downloads"
        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R && !PdmStorage.hasPublicAccess()) requestStorage(clean) else onDownload(clean)
    }
    fun openAddress(v: String) {
        val clean = v.trim(); if (clean.isBlank()) return
        address = clean
        if (clean.startsWith("http://", true) || clean.startsWith("https://", true)) {
            browserUrl = clean
            screen = "Browser"
        } else if (clean.startsWith("magnet:", true)) {
            showDownloadDialog(clean)
        } else {
            browserUrl = "https://www.google.com/search?q=${Uri.encode(clean)}"
            screen = "Browser"
        }
    }

    MaterialTheme(colorScheme = lightColorScheme(primary = Green, background = Color.White, surface = Color.White)) {
        if (splash) { SplashScreen(); return@MaterialTheme }
        if (!permissionsReady || permissionStep != 0) {
            PermissionScreen(permissionStep,
                { if (Build.VERSION.SDK_INT >= 33) notificationLauncher.launch(Manifest.permission.POST_NOTIFICATIONS) else permissionStep = 2 },
                onStorageSettings,
                { if (permissionStep == 1) permissionStep = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R && !PdmStorage.hasPublicAccess()) 2 else { finishPermissionFlow(); 0 } else finishPermissionFlow() })
            return@MaterialTheme
        }
        ModalNavigationDrawer(drawerState = drawerState, drawerContent = {
            ModalDrawerSheet(drawerContainerColor = Color.White) {
                Column(Modifier.fillMaxHeight().padding(vertical = 8.dp)) {
                    Row(Modifier.fillMaxWidth().padding(horizontal = 8.dp), verticalAlignment = Alignment.CenterVertically) {
                        IconButton(onClick = { drawerScope.launch { drawerState.close() } }) { Icon(Icons.Default.Close, "Close menu") }
                        Icon(Icons.Default.Download, null, Modifier.size(34.dp), tint = Green)
                        Spacer(Modifier.width(10.dp)); Text("Palia Download Manager", fontSize = 18.sp, fontWeight = FontWeight.ExtraBold, color = Dark)
                    }
                    HorizontalDivider()
                    NavigationDrawerItem(icon = { Icon(Icons.Default.Home, null) }, label = { Text("Home") }, selected = screen == "Home", onClick = { screen = "Home"; drawerScope.launch { drawerState.close() } })
                    NavigationDrawerItem(icon = { Icon(Icons.Default.Download, null) }, label = { Text("Downloads") }, selected = screen == "Downloads", onClick = { screen = "Downloads"; drawerScope.launch { drawerState.close() } })
                    NavigationDrawerItem(icon = { Icon(Icons.Default.Web, null) }, label = { Text("Browser") }, selected = screen == "Browser", onClick = { screen = "Browser"; drawerScope.launch { drawerState.close() } })
                    NavigationDrawerItem(icon = { Icon(Icons.Default.Settings, null) }, label = { Text("Settings") }, selected = screen == "Settings", onClick = { screen = "Settings"; drawerScope.launch { drawerState.close() } })
                    Spacer(Modifier.weight(1f))
                    Text("RECENT TABS", fontSize = 12.sp, fontWeight = FontWeight.Bold, color = Muted, modifier = Modifier.padding(20.dp, 10.dp, 20.dp, 6.dp))
                    if (historyItems.isEmpty()) Text("No recent tabs", color = Muted, modifier = Modifier.padding(horizontal = 20.dp))
                    else LazyColumn(Modifier.weight(0.55f, fill = false)) { items(historyItems.take(20), key = { it.url }) { item -> NavigationDrawerItem(icon = { Icon(Icons.Default.Language, null) }, label = { Text(item.url, maxLines = 2, overflow = TextOverflow.Ellipsis) }, selected = false, onClick = { address = item.url; browserUrl = item.url; screen = "Browser"; drawerScope.launch { drawerState.close() } }) } }
                }
            }
        }) {
            Scaffold(containerColor = Color.White, bottomBar = { NavigationBar(containerColor = Color(0xFFF4FFFB), tonalElevation = 0.dp) {
                NavItem("Home", Icons.Default.Home, screen == "Home") { screen = "Home" }
                NavItem("Downloads", Icons.Default.Download, screen == "Downloads") { screen = "Downloads" }
                NavItem("Browser", Icons.Default.Web, screen == "Browser") { screen = "Browser" }
                NavItem("Settings", Icons.Default.Settings, screen == "Settings") { screen = "Settings" }
            } }) { padding ->
                Box(Modifier.fillMaxSize().padding(padding)) {
                    when (screen) {
                        "Home" -> HomeScreen(address, { address = it }, { openAddress(address) }, { showDownloadDialog(address) }, { screen = "Browser" }, { screen = "Downloads" }, onPickTorrent) { drawerScope.launch { drawerState.open() } }
                        "Downloads" -> DownloadsScreen(context, { drawerScope.launch { drawerState.open() } })
                        "Browser" -> BrowserScreen(context, browserUrl, { address = it; saveHistory(it) }, { showDownloadDialog(it) }, { browserUrl = it; address = it }, { drawerScope.launch { drawerState.open() } })
                        else -> SettingsScreen(historyItems, { history.clear(); historyItems = emptyList() }, onStorageSettings) { drawerScope.launch { drawerState.open() } }
                    }
                }
            }
        }

        if (dialogUrl != null) {
            LaunchedEffect(dialogUrl) {
                val u = dialogUrl ?: return@LaunchedEffect
                dialogSize = withContext(Dispatchers.IO) {
                    try {
                        val c = (URL(u).openConnection() as HttpURLConnection).apply { requestMethod = "HEAD"; instanceFollowRedirects = true; connectTimeout = 7000; readTimeout = 7000 }
                        c.connect(); val n = c.contentLengthLong; c.disconnect(); if (n > 0) n else null
                    } catch (_: Throwable) { null }
                }
            }
            AlertDialog(onDismissRequest = { dialogUrl = null }, title = { Text("Download file", fontWeight = FontWeight.ExtraBold) }, text = {
                Column(verticalArrangement = Arrangement.spacedBy(10.dp)) {
                    Text(dialogName, fontWeight = FontWeight.Bold, maxLines = 2, overflow = TextOverflow.Ellipsis)
                    Text(dialogSize?.let { formatSize(it) } ?: "Size: checking…", color = Muted)
                    Text(dialogUrl ?: "", color = Muted, fontSize = 12.sp, maxLines = 3, overflow = TextOverflow.Ellipsis)
                }
            }, confirmButton = { Button(onClick = { enqueueDownload(dialogUrl ?: "") }) { Icon(Icons.Default.Download, null); Spacer(Modifier.width(8.dp)); Text("START") } }, dismissButton = { TextButton(onClick = { dialogUrl = null }) { Text("CANCEL") } })
        }
        if (exitDialog) AlertDialog(onDismissRequest = { exitDialog = false }, title = { Text("Exit Palia Download Manager?") }, text = { Text("Are you sure you want to exit?") }, confirmButton = { TextButton(onClick = { activity.finish() }) { Text("YES") } }, dismissButton = { TextButton(onClick = { exitDialog = false }) { Text("NO") } })
    }
}

