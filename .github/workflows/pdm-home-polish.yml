name: PDM Home Polish

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Polish PDM address bar and quick access'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Patch PDM home UI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('app/src/main/java/com/shanpalia/pdm/PdmMainActivity.kt')
          s = p.read_text()

          # Address bar: green download arrow instead of the word Download.
          s, n = re.subn(
              r'trailingIcon\s*=\s*\{\s*Button\(onClick\s*=\s*onGo.*?\{\s*Text\("Download"\)\s*\}\s*\}\s*,',
              'trailingIcon = { IconButton(onClick = onGo, modifier = Modifier.size(50.dp)) { Icon(Icons.Default.ArrowDownward, contentDescription = "Download", tint = Green, modifier = Modifier.size(30.dp)) } },',
              s, count=1, flags=re.S)
          if n == 0:
              print('Address bar pattern already patched or not found')

          # Apps and Games open the user's PaliaAPK HUB inside PDM's browser.
          hub = 'https://shanpalia.github.io/WebsitePaliaAPK_V.2/'
          s = re.sub(
              r'HomeTile\("Apps",\s*([^,]+),\s*([^,]+),\s*Modifier\.weight\(1f\)\)\s*\{.*?\}',
              lambda m: f'HomeTile("Apps", {m.group(1)}, {m.group(2)}, Modifier.weight(1f)) {{ openBrowser("{hub}") }}',
              s, count=1, flags=re.S)
          s = re.sub(
              r'HomeTile\("Games",\s*([^,]+),\s*([^,]+),\s*Modifier\.weight\(1f\)\)\s*\{.*?\}',
              lambda m: f'HomeTile("Games", {m.group(1)}, {m.group(2)}, Modifier.weight(1f)) {{ openBrowser("{hub}") }}',
              s, count=1, flags=re.S)

          # History gets a visible Recent tab/header while preserving the existing history content.
          marker = '@Composable private fun HistoryScreen(activity: ComponentActivity) {'
          if marker in s and 'Text("Recent", modifier = Modifier.padding(horizontal = 20.dp' not in s:
              recent = '''\n    Row(Modifier.fillMaxWidth().padding(horizontal = 18.dp, vertical = 8.dp), horizontalArrangement = Arrangement.spacedBy(10.dp)) {\n        Surface(shape = RoundedCornerShape(22.dp), color = Mint) {\n            Text("Recent", modifier = Modifier.padding(horizontal = 20.dp, vertical = 9.dp), color = Green, fontWeight = FontWeight.Bold)\n        }\n    }\n'''
              s = s.replace(marker, marker + recent, 1)

          p.write_text(s)
          PY

      - name: Verify source
        run: |
          grep -Fq 'contentDescription = "Download"' app/src/main/java/com/shanpalia/pdm/PdmMainActivity.kt
          grep -Fq 'WebsitePaliaAPK_V.2/' app/src/main/java/com/shanpalia/pdm/PdmMainActivity.kt
          grep -Fq 'Text("Recent", modifier = Modifier.padding(horizontal = 20.dp' app/src/main/java/com/shanpalia/pdm/PdmMainActivity.kt

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/shanpalia/pdm/PdmMainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Polish PDM address bar and quick access"
            git push
          fi
