name: Fix Compose Compile Errors

on:
  push:
    branches: [ main ]

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix Compose clickable and Button arguments'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fix Compose argument syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/shanpalia/pdm/PdmMainActivity.kt')
          s = p.read_text()
          s = s.replace('Modifier.clickable(onClick)', 'Modifier.clickable(onClick = onClick)')
          s = s.replace('Modifier.clickable(onClick) else Modifier', 'Modifier.clickable(onClick = onClick) else Modifier')
          s = s.replace('Button(enabled = !checking, onClick = { scope.launch { checking = true; status = "Checking website…"; val r = checkPdmUpdate(); if (r == null) { status = "Could not check for updates"; version = ""; updateUrl = "" } else if (r.available) { status = "Update available • v${r.version}"; version = r.version; updateUrl = r.url ?: "" } else { status = "Up to date • v${BuildConfig.VERSION_NAME}"; version = r.version; updateUrl = "" }; checking = false } }, Modifier.fillMaxWidth().height(50.dp), shape = RoundedCornerShape(25.dp))', 'Button(enabled = !checking, onClick = { scope.launch { checking = true; status = "Checking website…"; val r = checkPdmUpdate(); if (r == null) { status = "Could not check for updates"; version = ""; updateUrl = "" } else if (r.available) { status = "Update available • v${r.version}"; version = r.version; updateUrl = r.url ?: "" } else { status = "Up to date • v${BuildConfig.VERSION_NAME}"; version = r.version; updateUrl = "" }; checking = false } }, modifier = Modifier.fillMaxWidth().height(50.dp), shape = RoundedCornerShape(25.dp))')
          p.write_text(s)
          PY

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/shanpalia/pdm/PdmMainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix Compose clickable and Button arguments"
            git push
          fi
