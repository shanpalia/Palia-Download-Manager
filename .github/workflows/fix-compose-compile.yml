name: Fix Compose Compile Errors

on:
  push:
    branches: [ main ]

jobs:
  fix:
    if: github.event.head_commit.message != 'Fix remaining Compose syntax'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Fix Compose argument syntax
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/shanpalia/pdm/PdmMainActivity.kt')
          s = p.read_text()

          replacements = {
              'modifier.clickable(onClick)': 'modifier.clickable(onClick = onClick)',
              'Modifier.fillMaxWidth().padding(horizontal = 18.dp).clickable(onClick)': 'Modifier.fillMaxWidth().padding(horizontal = 18.dp).clickable(onClick = onClick)',
              'Button(onClick = { context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(updateUrl))) }, Modifier.fillMaxWidth().height(50.dp), shape = RoundedCornerShape(25.dp), colors = ButtonDefaults.buttonColors(containerColor = Blue))': 'Button(onClick = { context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(updateUrl))) }, modifier = Modifier.fillMaxWidth().height(50.dp), shape = RoundedCornerShape(25.dp), colors = ButtonDefaults.buttonColors(containerColor = Blue))',
          }

          for old, new in replacements.items():
              s = s.replace(old, new)

          p.write_text(s)
          PY

      - name: Verify no known bad patterns remain
        run: |
          ! grep -Fq 'modifier.clickable(onClick)' app/src/main/java/com/shanpalia/pdm/PdmMainActivity.kt
          ! grep -Fq 'Modifier.fillMaxWidth().padding(horizontal = 18.dp).clickable(onClick)' app/src/main/java/com/shanpalia/pdm/PdmMainActivity.kt
          ! grep -Fq 'Button(onClick = { context.startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(updateUrl))) }, Modifier.' app/src/main/java/com/shanpalia/pdm/PdmMainActivity.kt

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/shanpalia/pdm/PdmMainActivity.kt
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix remaining Compose syntax"
            git push
          fi
