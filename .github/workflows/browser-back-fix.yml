name: Fix PDM browser back navigation

on:
  push:
    branches: [main]
    paths:
      - ".github/pdm-browser-back-trigger"

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[browser-back-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch browser navigation without changing homepage UI
        shell: python
        run: |
          from pathlib import Path

          main = Path("app/src/main/java/com/shanpalia/pdm/MainActivity.kt")
          text = main.read_text(encoding="utf-8")

          old_call = '''"Browser" -> BrowserScreen(browserUrl, { address = it; browserUrl = it; saveHistory(it) }, { showDownload(it) }, { browserUrl = it; address = it }, { scope.launch { drawerState.open() } })'''
          new_call = '''"Browser" -> BrowserScreen(browserUrl, { address = it; browserUrl = it; saveHistory(it) }, { showDownload(it) }, { browserUrl = it; address = it }, { scope.launch { drawerState.open() } }, { screen = "Home" })'''
          if old_call in text and new_call not in text:
              text = text.replace(old_call, new_call, 1)

          old_sig = '''    onUrlChange: (String) -> Unit,
    onMenu: () -> Unit
) {'''
          new_sig = '''    onUrlChange: (String) -> Unit,
    onMenu: () -> Unit,
    onExit: () -> Unit
) {'''
          if old_sig not in text:
              raise SystemExit("BrowserScreen signature not found")
          text = text.replace(old_sig, new_sig, 1)

          anchor = '''    var field by remember(initialUrl) { mutableStateOf(TextFieldValue(initialUrl, TextRange(initialUrl.length))) }
    var webView by remember { mutableStateOf<WebView?>(null) }

    Column(Modifier.fillMaxSize()) {'''
          replacement = '''    var field by remember(initialUrl) { mutableStateOf(TextFieldValue(initialUrl, TextRange(initialUrl.length))) }
    var webView by remember { mutableStateOf<WebView?>(null) }

    // Browser-style back: stay inside WebView history first; leave Browser only when history is empty.
    BackHandler(enabled = true) {
        val view = webView
        if (view != null && view.canGoBack()) view.goBack() else onExit()
    }

    Column(Modifier.fillMaxSize()) {'''
          if anchor not in text:
              raise SystemExit("BrowserScreen anchor not found")
          text = text.replace(anchor, replacement, 1)

          main.write_text(text, encoding="utf-8")

      - name: Commit browser navigation fix
        shell: bash
        run: |
          rm -f .github/pdm-browser-back-trigger
          rm -f .github/workflows/browser-back-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/shanpalia/pdm/MainActivity.kt .github/pdm-browser-back-trigger .github/workflows/browser-back-fix.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix browser back navigation [browser-back-fixed]"
          git push
