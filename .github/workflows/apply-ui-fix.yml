name: Apply Palia UI Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Restore settings update feature'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch Settings screen
        run: python tools/restore_settings_update.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/shanpalia/pdm/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Restore settings update feature"
          git push
